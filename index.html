<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIGITAL LIFE MAP · ATLAS</title>
<style>
:root{color-scheme:dark;--bg:#101821;--panel:#192633;--line:#334656;--ink:#f0f5f4;--muted:#b2c3ce;--mint:#91e9bd;--purple:#bdb4fa;--amber:#ffcf84}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button,input,textarea{border:1px solid var(--line);border-radius:.65rem;padding:.55rem .75rem;color:inherit;background:#111d28}button:hover{border-color:var(--mint)}:focus-visible{outline:3px solid var(--amber);outline-offset:3px}button.primary,button[aria-current=page]{background:var(--mint);color:#10231e;border-color:var(--mint);font-weight:700}header,main,footer{width:min(1160px,94vw);margin:auto}header{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line)}header strong{letter-spacing:.1em}header span,footer,p,.hint,small{color:var(--muted)}.hero{position:relative;overflow:hidden;margin:1.2rem 0;background:radial-gradient(ellipse at 89% 46%,#2d665d 0,transparent 55%),linear-gradient(110deg,#213743,#162633);border:1px solid #416561;border-radius:1.5rem;padding:clamp(1.25rem,5vw,3.4rem)}.hero:after{content:"";position:absolute;right:0;top:0;width:46%;height:100%;background:radial-gradient(circle,#b9f4cf59 1.4px,transparent 1.8px) 0 0/18px 18px;mask-image:linear-gradient(90deg,transparent,#000);pointer-events:none}.hero h1{position:relative;z-index:1;margin:0;color:var(--mint);font-size:clamp(2rem,6vw,4.8rem);line-height:1;letter-spacing:-.045em}.hero p{position:relative;z-index:1;margin:.7rem 0;color:var(--ink);font-size:clamp(1.1rem,2.7vw,1.55rem)}.route{position:relative;z-index:1;color:var(--mint);font-size:.85rem}nav,.actions,.fields{display:flex;gap:.55rem;flex-wrap:wrap;align-items:end}nav{margin-bottom:1rem}.panel{border:1px solid var(--line);background:var(--panel);border-radius:1.2rem;padding:clamp(1rem,3vw,1.8rem)}.section-head{display:flex;align-items:start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}h2,h3,p{margin:0 0 .55rem}h2{font-size:clamp(1.55rem,4vw,2.35rem);line-height:1.15}h3{font-size:1.05rem}.section-head p{margin:.4rem 0 0}label{display:grid;gap:.25rem;font-size:.9rem}input,textarea{min-width:0;max-width:100%}input[type=number]{width:7rem}input[type=checkbox]{accent-color:var(--mint);width:1.15rem;height:1.15rem}input[type=range]{accent-color:var(--mint)}textarea{width:100%;margin-top:.2rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:.6rem;margin:1.2rem 0}.stat{padding:.8rem;background:#111d28;border:1px solid var(--line);border-radius:.7rem}.stat strong{display:block;font-size:1.55rem;color:var(--mint)}.scroll{overflow:auto;margin:1rem 0}.map{min-width:525px}.year{display:grid;grid-template-columns:2.5rem repeat(53,minmax(0,1fr));gap:3px;align-items:center;margin:.22rem 0}.year small{font-size:.7rem}.week{aspect-ratio:1;background:#354959;border-radius:2px}.week.past{background:var(--mint)}.week.now{background:var(--amber)}.key{display:flex;gap:1rem;flex-wrap:wrap;font-size:.84rem}.key i{display:inline-block;width:.65rem;height:.65rem;border-radius:2px;margin-right:.35rem}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:.55rem;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:.85rem}td input[type=text]{width:min(100%,19rem)}.icon{padding:.25rem .55rem}.bar{height:1rem;background:#111d28;border-radius:.5rem;overflow:hidden;display:flex;margin:.7rem 0}.bar span{height:100%}.goal{border:1px solid var(--line);border-radius:.8rem;padding:1rem;margin:.8rem 0}.goal label:has(input[type=checkbox]){display:flex;align-items:center;gap:.45rem}.balance{display:grid;grid-template-columns:minmax(180px,1fr) minmax(240px,1fr);gap:1.5rem;align-items:center}.balance canvas{max-width:100%;height:auto;margin:auto;display:block}.ranges label{display:grid;grid-template-columns:1fr 2rem;align-items:center;margin:.35rem 0}.ranges input{grid-column:1/-1;width:100%;padding:0}.audit-row{margin:.7rem 0}.audit-row .bar{height:.55rem;margin:.2rem 0}.reflection{margin-top:1.3rem}footer{padding:1.15rem 0 2rem;font-size:.86rem}#notice{margin-top:.7rem;min-height:1.5rem;color:var(--amber)}@media(max-width:620px){.balance{grid-template-columns:1fr}header span{display:none}.fields label:has(textarea){width:100%}}@media print{:root{color-scheme:light}body,.panel,.hero,.stat{background:white;color:black}p,small,footer,label,.hero p,.hint,th{color:#222}nav,button,#notice{display:none!important}.scroll{overflow:visible}.hero,.panel{border:0}.hero h1,.route,.stat strong{color:#104b36}.week,.bar{print-color-adjust:exact}header,main,footer{width:100%}}
</style>
</head>
<body>
<header><strong>DIGITAL LIFE MAP</strong><span>№167 жалпы білім беретін мектеп · Алматы</span></header>
<main>
<div class="hero"><h1>DIGITAL LIFE MAP</h1><p>Жеке цифрлық даму картасы</p><div class="route">Көр → Өлше → Талда → Мақсат қой → Әрекет ет → Қайта бағала</div></div>
<nav aria-label="Құралдар" id="nav"></nav>
<section class="panel" id="panel" aria-labelledby="title"></section>
<div id="notice" role="status"></div>
</main>
<footer>Ғылыми жоба авторлары · Балабек Гаухар, Төребай Милана<br>Ғылыми жетекші · Торыбаева Гульжахан Ауесхановна</footer>
<script>
'use strict';
const sections = [
 ['atlas','ATLAS','Туған күніңізді енгізіп, өткен уақытыңызды апта бойынша көріңіз.'],
 ['day','Менің бір күнім','Әр әрекетке кеткен минуттарды енгізіп, 24 сағаттың қалай бөлінетінін көріңіз.'],
 ['goals','Мақсаттар картасы','SMART мақсатын анықтап, оны өлшенетін қадамдарға бөліңіз.'],
 ['habits','Әдеттер трекері','Апта таңдап, әдет орындалған күндерді белгілеңіз.'],
 ['balance','Life Balance','Әр саланы 1–10 балмен бағалап, қай бағытқа көңіл бөлетініңізді анықтаңыз.'],
 ['audit','Time Audit','Болжамды және нақты жұмсалған уақытты минутпен салыстырыңыз.']
];
const areas=['Оқу','Ұйқы','Денсаулық','Отбасы','Хобби','Демалыс','Өзін дамыту'];
const colors=['#91e9bd','#bdb4fa','#ffcf84','#7cd8ef','#eeaacb','#b8e383','#f4ae91'];
const key='digital-life-map-v1';
const start={birth:'',day:[],goals:[],habits:[],balance:areas.map(()=>5),audit:[],notes:{}};
let data=structuredClone(start), section='atlas', week=dateKey(monday(new Date())), storageOK=true;
try {data={...data,...JSON.parse(localStorage.getItem(key)||'{}')};} catch {storageOK=false;}
const $=id=>document.getElementById(id);
const fmt=new Intl.NumberFormat('kk-KZ',{maximumFractionDigits:2});
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayMs=86400000;
function dateKey(date){return [String(date.getFullYear()).padStart(4,'0'),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
function monday(date){const d=new Date(date);d.setDate(d.getDate()-(d.getDay()+6)%7);return d;}
function shift(key,days){const date=new Date(key+'T12:00');date.setDate(date.getDate()+days);return dateKey(date);}
function save(){
 try{localStorage.setItem(key,JSON.stringify(data));storageOK=true;}catch{storageOK=false;}
 $('notice').textContent=storageOK?'Деректер осы браузерде сақталады.':'Бұл браузерде сақтау қолжетімсіз. Деректер ашық бетте ғана сақталады.';
}
function input(label,name,type='text',attributes=''){return `<label>${label}<input name="${name}" type="${type}" ${attributes}></label>`;}
function draw(){
 const [,title,desc]=sections.find(x=>x[0]===section);
 $('nav').innerHTML=sections.map(([id,label])=>`<button data-section="${id}" ${id===section?'aria-current="page"':''}>${label}</button>`).join('');
 $('panel').innerHTML=`<div class="section-head"><div><h2 id="title">${title}</h2><p>${desc}</p></div><button id="demo">Жоба мысалын көру</button></div>`+
 ({atlas,day,goals,habits,balance,audit}[section]())+
 (section==='atlas'?'':`<label class="reflection">Қорытынды және келесі әрекет<textarea id="note" rows="2" placeholder="Не байқадым? Келесі қадамым қандай?">${esc(data.notes[section])}</textarea></label>`);
 $('demo').onclick=demo;
 if($('note')) $('note').oninput=e=>{data.notes[section]=e.target.value;save();};
 if(section==='balance') plot();
 if(section==='atlas') $('birth').onchange=e=>{data.birth=e.target.value;save();$('atlas-result').innerHTML=map();};
}
function atlas(){return `<div class="fields"><label for="birth">Туған күн<input id="birth" type="date" min="0001-01-01" max="${dateKey(new Date())}" value="${esc(data.birth)}"></label></div><div id="atlas-result">${map()}</div>`;}
function map(){
 if(!data.birth)return '<p class="hint">Карта туған күнді таңдаған соң ашылады.</p>';
 const today=dateKey(new Date()), passed=(Date.parse(today)-Date.parse(data.birth))/dayMs;
 if(!Number.isInteger(passed)||passed<0||data.birth<'0001-01-01')return '<p role="alert">Бүгінгі күннен ерте немесе бүгінгі күнді таңдаңыз.</p>';
 const [year,month,dayOfMonth]=data.birth.split('-').map(Number);
 function anniversary(offset){
  const d=new Date(0);
  d.setUTCFullYear(year+offset,month-1,1);
  const last=new Date(d);last.setUTCMonth(month,0);
  d.setUTCDate(Math.min(dayOfMonth,last.getUTCDate()));return d.getTime();
 }
 const now=Date.parse(today);
 let age=Number(today.slice(0,4))-year;
 if(anniversary(age)>now) age--;
 const rows=[];
 for(let i=0;i<=age;i++){
  const start=anniversary(i),end=anniversary(i+1);
  let cells='';
  for(let t=start;t<end;t+=7*dayMs){
   const next=Math.min(t+7*dayMs,end),kind=next<=now?'past':t<=now?'now':'';
   const iso=new Date(t).toISOString().slice(0,10);
   cells+=`<span class="week ${kind}" title="${iso} · ${(next-t)/dayMs} күн"></span>`;
  }
  rows.push(`<div class="year" title="${i+1}-өмір жылы"><small>${i+1}</small>${cells}</div>`);
 }
 const stats=[[passed,'күн'],[Math.floor(passed/7),'толық апта'],[passed*24,'сағат'],[age,'толық жас']];
 return `<div class="stats">${stats.map(([n,l])=>`<div class="stat"><strong>${fmt.format(n)}</strong>${l}</div>`).join('')}</div>
 <h3>Өмірдің апталық картасы</h3><p>Әр қатар туған күннен басталатын бір өмір жылы. Соңғы ұяшық 1–2 күнді қамтуы мүмкін.</p>
 <div class="key"><span><i style="background:var(--mint)"></i>Өткен</span><span><i style="background:var(--amber)"></i>Ағымдағы</span><span><i style="background:#354959"></i>Ағымдағы өмір жылының келесі аптасы</span></div>
 <div class="scroll" tabindex="0" aria-label="Өмірдің апталық картасы"><div class="map">${rows.join('')}</div></div>`;
}
function remove(i,label){return `<button class="icon" data-remove="${i}" aria-label="${esc(label)} жолын жою">×</button>`;}
function day(){
 const sum=data.day.reduce((s,r)=>s+r[1],0);
 const diff=1440-sum;
 return `<form class="fields" id="add">${input('Әрекет','label','text','required maxlength="80" placeholder="Мысалы, ұйқы"')}${input('Минут','minutes','number','required min="1" max="1440"')}<button class="primary">Қосу</button></form>
 <div class="stats"><div class="stat"><strong>${fmt.format(sum)}</strong>тіркелген минут</div><div class="stat"><strong>${fmt.format(Math.abs(diff))}</strong>${diff<0?'тәуліктен артық минут':'тіркелмеген минут'}</div></div>
 <div class="bar" aria-hidden="true">${data.day.map((r,i)=>`<span style="width:${r[1]/Math.max(sum,1440)*100}%;background:${colors[i%colors.length]}"></span>`).join('')}</div>
 <div class="scroll"><table><thead><tr><th>Әрекет</th><th>Минут</th><th>Тәулік үлесі</th><th>Өңдеу</th></tr></thead><tbody>${data.day.map(([l,n],i)=>`<tr><td>${esc(l)}</td><td>${n}</td><td>${fmt.format(n/14.4)}%</td><td>${remove(i,l)}</td></tr>`).join('')}</tbody></table></div>`;
}
function goals(){
 return `<form id="add"><div class="fields">${input('Нақты мақсат','label','text','required maxlength="150"')}${input('Нәтиже өлшемі','measure','text','required maxlength="100"')}${input('Мерзімі','due','date','required')}${input('Мақсаттың маңызы','reason','text','required maxlength="150"')}</div><label style="margin:.7rem 0">Қолжетімді қадамдар (әр жолға бір қадам)<textarea name="steps" rows="3" maxlength="1000" required></textarea></label><button class="primary">Мақсат қосу</button></form>
 ${data.goals.map((g,i)=>`<article class="goal"><div class="section-head"><div><h3>${esc(g.label)}</h3><p>${esc(g.measure)} · ${esc(g.due)}</p><small>${esc(g.reason)}</small></div>${remove(i,g.label)}</div>
 ${g.steps.map(([name,done],j)=>`<label><input type="checkbox" data-goal="${i}" data-step="${j}" ${done?'checked':''}>${esc(name)}</label>`).join('')}
 <p aria-live="polite" id="goal-${i}">${goalStatus(g)}</p></article>`).join('')}`;
}
function goalStatus(g){return `${g.steps.filter(x=>x[1]).length} / ${g.steps.length} қадам орындалды`;}
function habits(){
 const dates=Array.from({length:7},(_,i)=>shift(week,i));
 return `<form class="fields" id="add">${input('Әдет атауы','label','text','required maxlength="80"')}<button class="primary">Әдет қосу</button></form>
 <div class="actions" style="margin-top:1rem"><button data-week="-7" aria-label="Алдыңғы апта">←</button><label>Аптаны таңдау<input id="week" type="date" value="${week}"></label><button data-week="7" aria-label="Келесі апта">→</button></div>
 <div class="scroll"><table><thead><tr><th>Әдет</th>${dates.map((d,i)=>`<th>${['Дс','Сс','Ср','Бс','Жм','Сб','Жс'][i]}<br>${d.slice(8)}.${d.slice(5,7)}</th>`).join('')}<th>Апта</th><th>Өңдеу</th></tr></thead><tbody>
 ${data.habits.map((h,i)=>`<tr><th scope="row">${esc(h.label)}</th>${dates.map(d=>`<td><input type="checkbox" data-habit="${i}" data-date="${d}" aria-label="${esc(h.label)} · ${d}" ${h.days[d]?'checked':''}></td>`).join('')}<td id="habit-${i}">${habitStatus(h)}</td><td>${remove(i,h.label)}</td></tr>`).join('')}</tbody></table></div>`;
}
function habitStatus(h){const n=Array.from({length:7},(_,i)=>shift(week,i)).filter(d=>h.days[d]).length;return `${n}/7 · ${Math.round(n/7*100)}%`;}
function balance(){
 return `<div class="balance"><canvas id="chart" width="360" height="360" role="img" aria-label="Өмір салаларының тепе-теңдік диаграммасы"></canvas><div class="ranges">
 ${areas.map((a,i)=>`<label>${a}<output id="score-${i}">${data.balance[i]}</output><input type="range" min="1" max="10" value="${data.balance[i]}" data-area="${i}"></label>`).join('')}</div></div><p id="balance-summary" aria-live="polite"></p>`;
}
function plot(){
 const canvas=$('chart'),ctx=canvas.getContext('2d'), mid=180,r=148;
 function polygon(values){
  ctx.beginPath();values.forEach((v,i)=>{const angle=i*2*Math.PI/areas.length-Math.PI/2;ctx[i?'lineTo':'moveTo'](mid+r*v/10*Math.cos(angle),mid+r*v/10*Math.sin(angle));});ctx.closePath();
 }
 ctx.clearRect(0,0,360,360);
 ctx.strokeStyle='#506574';
 for(let i=2;i<=10;i+=2){polygon(areas.map(()=>i));ctx.stroke();}
 polygon(data.balance);ctx.fillStyle='#91e9bd60';ctx.fill();ctx.strokeStyle='#91e9bd';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
 ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f0f5f4';
 data.balance.forEach((v,i)=>{const angle=i*2*Math.PI/areas.length-Math.PI/2;ctx.fillText(String(v),mid+165*Math.cos(angle),mid+165*Math.sin(angle));});
 const avg=data.balance.reduce((s,v)=>s+v,0)/areas.length,min=Math.min(...data.balance);
 $('balance-summary').textContent='Орташа баға '+fmt.format(avg)+'/10. Ең төмен баға алған салалар — '+areas.filter((_,i)=>data.balance[i]===min).join(', ')+'.';
 canvas.setAttribute('aria-label',areas.map((a,i)=>a+' '+data.balance[i]+'/10').join(', '));
}
function audit(){
 const max=Math.max(1,...data.audit.flatMap(r=>r.slice(1)));
 return `<form class="fields" id="add">${input('Әрекет','label','text','required maxlength="80"')}${input('Болжам, мин','plan','number','required min="0" max="1440"')}${input('Нақты, мин','actual','number','required min="0" max="1440"')}<button class="primary">Салыстыру</button></form>
 <div class="scroll"><table><thead><tr><th>Әрекет</th><th>Болжам</th><th>Нақты</th><th>Айырма</th><th>Өңдеу</th></tr></thead><tbody>${data.audit.map(([l,p,a],i)=>`<tr><td>${esc(l)}</td><td>${p} мин</td><td>${a} мин</td><td>${a>p?'+':''}${a-p} мин</td><td>${remove(i,l)}</td></tr>`).join('')}</tbody></table></div>
 ${data.audit.length?`<div class="key"><span><i style="background:var(--purple)"></i>Болжам</span><span><i style="background:var(--mint)"></i>Нақты</span></div>
 ${data.audit.map(([l,p,a])=>`<div class="audit-row">${esc(l)}<div class="bar" aria-hidden="true"><span style="width:${100*p/max}%;background:var(--purple)"></span></div><div class="bar" aria-hidden="true"><span style="width:${100*a/max}%;background:var(--mint)"></span></div></div>`).join('')}`:''}`;
}
const examples={
 birth:'2010-05-15',
 day:[['Таңғы дайындық',30],['Оқу',360],['Тамақтану',60],['Демалыс',60],['Үй тапсырмасы',120],['Телефон',60],['Отбасы және жеке уақыт',120],['Ұйқы',510]],
 goals:[{label:'30 күнде 150 ағылшын сөзін үйрену',measure:'150 сөзді сөйлемде қолдану',reason:'Ағылшын тіліндегі сөздік қорды кеңейту',steps:[['Күніне 5 жаңа сөз үйрену',false],['Әр 7 күн сайын өзімді тексеру',false],['30 күннен соң қорытынды тексеру',false]]}],
 balance:[8,6,5,9,4,5,6],
 audit:[['Оқу',180,140],['Әлеуметтік желі',60,105],['Хобби',60,40],['Демалыс',120,150]]
};
function demo(){
 const field=section==='atlas'?'birth':section;
 if((field==='balance'||data[field].length)&&!confirm('Осы бөлімдегі мәндерді мысал деректерімен ауыстырасыз ба?'))return;
 if(section==='habits'){
  week='2026-11-09';
  data.habits=[['Кітап оқу',[5,6,6,7]],['Таңғы жаттығу',[4,5,5,6]],['Ағылшын сөздерін оқу',[6,6,7,7]]].map(([label,counts])=>{
   const days={};
   counts.forEach((count,i)=>{for(let j=0;j<count;j++) days[shift(week,i*7+j)]=true;});
   return {label,days};
  });
 }else{
  data[field]=structuredClone(examples[field]);
  if(section==='goals')data.goals[0].due=shift(dateKey(new Date()),30);
 }
 save();draw();
 if(section==='habits')$('notice').textContent+=' Мысалда құжаттағы апталық жиілік алғашқы күндерге шартты түрде белгіленді.';
 if(section==='atlas')$('notice').textContent+=' Мысал үшін шартты туған күн енгізілді.';
}
$('nav').onclick=e=>{const next=e.target.dataset.section;if(next){section=next;draw();$('nav').querySelector('[aria-current]').focus();}};
$('panel').onsubmit=e=>{
 e.preventDefault();
 const form=e.target;
 if(form.id!=='add')return;
 const values=new FormData(form), label=values.get('label').trim();
 if(!label){$('notice').textContent='Атау енгізіңіз.';return;}
 if(section==='day')data.day.push([label,Number(values.get('minutes'))]);
 if(section==='audit')data.audit.push([label,Number(values.get('plan')),Number(values.get('actual'))]);
 if(section==='habits')data.habits.push({label,days:{}});
 if(section==='goals'){
  const measure=values.get('measure').trim(),reason=values.get('reason').trim();
  const steps=values.get('steps').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!steps.length||!measure||!reason){$('notice').textContent='Нәтиже өлшемін, мақсаттың маңызын және кемінде бір қадамды енгізіңіз.';return;}
  data.goals.push({label,measure,reason,due:values.get('due'),steps:steps.map(s=>[s,false])});
 }
 save();draw();$('add').elements.label.focus();
};
$('panel').onclick=e=>{
 const a=e.target.dataset;
 if(a.remove!==undefined&&confirm('Осы жазбаны жоясыз ба?')){data[section].splice(Number(a.remove),1);save();draw();}
 if(a.week){week=shift(week,Number(a.week));draw();$('week').focus();}
};
$('panel').onchange=e=>{
 const el=e.target,a=el.dataset;
 if(el.id==='week'&&el.value){week=dateKey(monday(new Date(el.value+'T12:00')));draw();$('week').focus();}
 if(a.goal!==undefined){const g=data.goals[a.goal];g.steps[a.step][1]=el.checked;$('goal-'+a.goal).textContent=goalStatus(g);save();}
 if(a.habit!==undefined){const h=data.habits[a.habit];if(el.checked)h.days[a.date]=true;else delete h.days[a.date];$('habit-'+a.habit).textContent=habitStatus(h);save();}
};
$('panel').oninput=e=>{
 const i=e.target.dataset.area;
 if(i!==undefined){data.balance[i]=Number(e.target.value);$('score-'+i).value=e.target.value;plot();save();}
};
draw();
if(!storageOK) $('notice').textContent='Бұл браузерде деректерді сақтау қолжетімсіз.';
</script>
</body>
</html>
